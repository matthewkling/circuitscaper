# Runs the integration tests, which talk to Julia, against a real Julia
# installation with Circuitscape.jl and Omniscape.jl. The regular
# R-CMD-check workflow has no Julia, so it skips all of them.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: julia-integration.yaml

permissions: read-all

jobs:
  julia-integration:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (R ${{ matrix.config.r }}, Julia ${{ matrix.config.julia }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest,  r: 'release', julia: '1'}
          - {os: macos-latest,   r: 'release', julia: '1'}
          - {os: windows-latest, r: 'release', julia: '1'}
          # Oldest Julia circuitscaper supports
          - {os: ubuntu-latest,  r: 'release', julia: '1.10'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      # Make integration tests fail, not skip, if Julia can't be set up
      CIRCUITSCAPER_REQUIRE_JULIA: 'true'
      # Start Julia with two default threads and no interactive thread, so
      # the parallel os_run() test runs
      JULIA_NUM_THREADS: '2,0'
      NOT_CRAN: 'true'

    defaults:
      run:
        # bash on every OS, including Windows (Git Bash), so quoting in the
        # julia -e and Rscript -e commands below works the same everywhere
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.config.julia }}

      - uses: julia-actions/cache@v3

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Install Circuitscape.jl and Omniscape.jl
        run: julia -e 'using Pkg; Pkg.add(["Circuitscape", "Omniscape"]); Pkg.precompile()'

      - name: Report versions
        run: |
          julia --version
          julia -e 'using Pkg; Pkg.status()'
          Rscript -e 'sessionInfo(); packageVersion("JuliaCall")'

      - name: Run tests
        run: Rscript -e 'testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)'

      # JuliaCall installs RCall.jl and Suppressor.jl by running
      # install_dependency.jl in a Julia subprocess of R, and discards its
      # output. If that crashed, rerun it visibly (so Julia's backtrace
      # shows), first as JuliaCall runs it, inheriting the LD_LIBRARY_PATH R
      # sets for its child processes, then with LD_LIBRARY_PATH unset.
      - name: Diagnose JuliaCall's dependency install (Linux, on failure)
        if: failure() && runner.os == 'Linux'
        run: |
          Rscript -e '
            script <- system.file("julia/install_dependency.jl", package = "JuliaCall")
            julia <- circuitscaper:::find_julia_bin(login_shell = FALSE)
            cat("julia:", julia, "\nR_HOME:", R.home(), "\n")
            cat("LD_LIBRARY_PATH inside R:", Sys.getenv("LD_LIBRARY_PATH"), "\n\n")
            cat("== install_dependency.jl as JuliaCall runs it ==\n")
            print(system2(julia, c("--startup-file=no", script, R.home())))
            cat("\n== same, with LD_LIBRARY_PATH unset ==\n")
            Sys.unsetenv("LD_LIBRARY_PATH")
            print(system2(julia, c("--startup-file=no", script, R.home())))
          '
          echo "LD_LIBRARY_PATH outside R: ${LD_LIBRARY_PATH:-<unset>}"
          cat "$(R RHOME)/etc/ldpaths"

  # The new-user path: no Julia set up beforehand, CRAN JuliaCall, and
  # cs_install_julia() downloading Julia itself. force = TRUE so it installs
  # its own Julia even where the runner image already has one on the PATH.
  fresh-install:
    runs-on: ${{ matrix.os }}

    name: fresh install, ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CIRCUITSCAPER_REQUIRE_JULIA: 'true'
      NOT_CRAN: 'true'

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat, local::.
          needs: check

      - name: Install Julia and packages with cs_install_julia()
        run: |
          Rscript -e 'packageVersion("JuliaCall")'
          Rscript -e 'circuitscaper::cs_install_julia(force = TRUE)'

      - name: Run tests in a new session
        run: Rscript -e 'testthat::test_local(".", reporter = "summary", stop_on_failure = TRUE)'

      # JuliaCall installs RCall.jl and Suppressor.jl by running
      # install_dependency.jl in a Julia subprocess of R, and discards its
      # output. If that crashed, rerun it visibly (so Julia's backtrace
      # shows), first as JuliaCall runs it, inheriting the LD_LIBRARY_PATH R
      # sets for its child processes, then with LD_LIBRARY_PATH unset.
      - name: Diagnose JuliaCall's dependency install (Linux, on failure)
        if: failure() && runner.os == 'Linux'
        run: |
          Rscript -e '
            script <- system.file("julia/install_dependency.jl", package = "JuliaCall")
            julia <- circuitscaper:::find_julia_bin(login_shell = FALSE)
            cat("julia:", julia, "\nR_HOME:", R.home(), "\n")
            cat("LD_LIBRARY_PATH inside R:", Sys.getenv("LD_LIBRARY_PATH"), "\n\n")
            cat("== install_dependency.jl as JuliaCall runs it ==\n")
            print(system2(julia, c("--startup-file=no", script, R.home())))
            cat("\n== same, with LD_LIBRARY_PATH unset ==\n")
            Sys.unsetenv("LD_LIBRARY_PATH")
            print(system2(julia, c("--startup-file=no", script, R.home())))
          '
          echo "LD_LIBRARY_PATH outside R: ${LD_LIBRARY_PATH:-<unset>}"
          cat "$(R RHOME)/etc/ldpaths"
